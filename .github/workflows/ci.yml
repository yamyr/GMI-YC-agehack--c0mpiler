name: ci

# Pre-flight checks for every pull request and push to main.
#
# Rust checks run on a pinned macOS runner so the crate compiles against the
# real target frameworks (WKWebView) without surprise macos-latest image
# migrations. Frontend checks run on Ubuntu.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BUN_VERSION: 1.3.10

jobs:
  frontend:
    name: frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: install dependencies
        run: bun install --frozen-lockfile

      - name: typecheck
        run: bunx tsc --noEmit

      - name: unit tests
        run: bun run test

      - name: production build
        run: bun run build

  # macOS: Playwright's Chromium needs no system packages here. On Ubuntu the
  # --with-deps step depends on apt mirrors, which have been unreachable on the
  # hosted runner image (apt exit 100), failing runs before any test executed.
  e2e:
    name: e2e and website (Chromium)
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: install dependencies
        run: bun install --frozen-lockfile

      - name: install Playwright Chromium
        run: bunx playwright install chromium

      - name: typecheck e2e
        run: bunx tsc -p e2e/tsconfig.json

      - name: e2e suite
        run: bun run e2e

      # The website in site/ has no Playwright journeys; this opens every page of the built
      # site and fails on errors, overflow, text below 16px or accessibility violations.
      - name: website check
        run: bun run check:site

      - name: upload traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore

  rust:
    name: rust checks (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      # tauri::generate_context! requires the frontendDist path to exist at
      # compile time; an empty placeholder is enough for check/lint/test.
      - name: prepare frontendDist placeholder
        run: mkdir -p dist

      - name: format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: lint (clippy, warnings are errors)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  # Constitution principle VI: every Rust dependency's licence is on the allowlist in
  # src-tauri/deny.toml, comes from crates.io, and has no known vulnerability.
  licences:
    name: licences and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: cargo deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: src-tauri/Cargo.toml
