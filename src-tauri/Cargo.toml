[package]
name = "agely"
version = "0.0.1"
description = "Agely — a 15-minute expert that helps adults nearing or in retirement find meaning"
authors = ["Volodymyr IER", "Agely core contributors"]
edition = "2021"
license = "MIT"
publish = false

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name
# (see https://github.com/rust-lang/cargo/issues/8519).
name = "agely_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
